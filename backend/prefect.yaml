pull:
  - prefect.deployments.steps.git_clone:
      repository: "https://github.com/Ryan3389/economy_project.git"
      branch: "main"

  - prefect.deployments.steps.run_shell_script:
      script: |
        pip install -U uv
        cd backend
        uv sync --frozen
        export PATH="$(pwd)/.venv/bin:$PATH"