pull:
  - prefect.deployments.steps.git_clone:
      id: clone
      repository: "https://github.com/Ryan3389/economy_project.git"
      branch: "main"

  - prefect.deployments.steps.run_shell_script:
      directory: "{{ clone.directory }}/backend"
      env:
        PYTHONPATH: "{{ clone.directory }}"
      script: |
        python -m pip install -U uv
        uv sync --frozen --system

deployments:
  - name: economy_summary
    entrypoint: backend/server/etl/page_a_etl.py:run_page_a_etl
    work_pool:
      name: macro-economy-pool

  - name: forecast-flow
    entrypoint: backend/server/flows/forecast_flow.py:train_forecast_models_flow
    work_pool:
      name: macro-economy-pool



